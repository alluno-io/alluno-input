[package]
name = "alluno-input"
description = "Virtual input devices for every platform Alluno runs on: keyboard, mouse, pen, touch and gamepads behind one runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
alluno-input-core = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
alluno-input-windows = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
alluno-input-linux = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
alluno-input-macos = { workspace = true }
