name: AllunoVHID
options:
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    CODE_SIGN_STYLE: Manual
    GENERATE_INFOPLIST_FILE: NO
  configs:
    Debug:
      CODE_SIGN_IDENTITY: "-"
      DEVELOPMENT_TEAM: ""
      ENABLE_HARDENED_RUNTIME: NO
    Release:
      CODE_SIGN_IDENTITY: "Developer ID Application"
      DEVELOPMENT_TEAM: "${ALLUNO_APPLE_TEAM}"
      ENABLE_HARDENED_RUNTIME: YES
targets:
  AllunoVHID:
    type: driver-extension
    platform: macOS
    sources:
      - path: AllunoVHID/AllunoVHIDBus.iig
        buildPhase: sources
      - path: AllunoVHID/AllunoVHIDDevice.iig
        buildPhase: sources
      - path: AllunoVHID/AllunoVHIDUserClient.iig
        buildPhase: sources
      - path: AllunoVHID/AllunoVHIDBus.cpp
      - path: AllunoVHID/AllunoVHIDDevice.cpp
      - path: AllunoVHID/AllunoVHIDUserClient.cpp
      - path: AllunoVHID/vhid_wire.h
        buildPhase: none
      - path: AllunoVHID/Info.plist
        buildPhase: none
      - path: AllunoVHID/AllunoVHID.dev.entitlements
        buildPhase: none
    dependencies:
      - sdk: DriverKit.framework
      - sdk: HIDDriverKit.framework
    settings:
      base:
        PRODUCT_NAME: io.alluno.AllunoVHID
        PRODUCT_BUNDLE_IDENTIFIER: io.alluno.AllunoVHID
        INFOPLIST_FILE: AllunoVHID/Info.plist
        SDKROOT: driverkit
        SUPPORTED_PLATFORMS: driverkit
        DRIVERKIT_DEPLOYMENT_TARGET: "22.0"
        CLANG_CXX_LANGUAGE_STANDARD: gnu++17
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: AllunoVHID/AllunoVHID.dev.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: AllunoVHID/AllunoVHID.entitlements
          PROVISIONING_PROFILE_SPECIFIER: "${ALLUNO_DEXT_PROFILE}"
  AllunoVHIDActivator:
    type: application
    platform: macOS
    sources:
      - path: Activator/main.swift
      - path: Activator/Info.plist
        buildPhase: none
      - path: Activator/Activator.entitlements
        buildPhase: none
    dependencies:
      - target: AllunoVHID
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.alluno.desktop
        INFOPLIST_FILE: Activator/Info.plist
        CODE_SIGN_ENTITLEMENTS: Activator/Activator.entitlements
        SWIFT_VERSION: "5.0"
